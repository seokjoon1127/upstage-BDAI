# 지원제도 매칭 사전 — 조건은 필터가 아니라 분기다
#
# 이 스킬은 사용자에게 나이·성별·창업경력을 묻지 않는다.
# 대신 조건별로 갈라서 전부 보여준다. "만 39세 이하라면 +3건" 같은 형태다.
# 여기 적힌 키워드가 그 분기를 만든다.
#
# 실측 확인: 2026-07-29, 기업마당 오픈API 500건 표본
# 조건 키워드: 2026년 창업지원사업 공고문(청년창업사관학교·예비창업패키지 등) 다수 교차 확인
# 매칭 대상 필드: pblancNm(공고명) + hashtags + bsnsSumryCn(사업요약) + trgetNm(대상)

# ── 1단계: 지역 필터 ───────────────────────────────────────────
# 기업마당 소관기관(jrsdInsttNm)은 시·도 단위까지만 나온다. 자치구는 본문에서 잡는다.
region:
  # 전국 대상 — 서울 창업자도 신청 가능
  nationwide_institutions:
    - 중소벤처기업부
    - 소상공인시장진흥공단
    - 산업통상부
    - 고용노동부
    - 중소기업진흥공단
    - 창업진흥원
    - 기술보증기금
    - 신용보증기금
  # 서울 한정
  seoul_institutions:
    - 서울특별시
    - 서울신용보증재단
    - 서울경제진흥원
  # 이 목록 밖의 지자체(경기도·경상북도 등)는 제외한다.
  exclude_other_local: true
  # 공고명이 [지역] 으로 시작하면 그 지역 한정 사업이다.
  # 소관기관이 중소벤처기업부여도 "[경기] 고양시 …" 는 서울 창업자가 신청할 수 없다.
  # 아래 태그로 시작하면 제외한다. ([재공고],[수정] 같은 비지역 태그는 통과)
  exclude_title_tags:
    - 경기
    - 인천
    - 부산
    - 대구
    - 광주
    - 대전
    - 울산
    - 세종
    - 강원
    - 충북
    - 충남
    - 충청
    - 전북
    - 전남
    - 경북
    - 경남
    - 제주
  # 서울 안에서도 특정 자치구 전용 공고가 있다.
  # 다른 자치구만 언급하고 우리 자치구는 언급하지 않으면 제외한다.
  district_exclusive_check: true

# ── 2단계: 관련성 필터 ─────────────────────────────────────────
# 소상공인 점포 창업과 무관한 공고를 걸러낸다.
# ("CES 통합한국관 참가기업 모집" 같은 것은 카페 창업자에게 의미 없다)
relevance:
  # 하나라도 걸리면 관련 있다고 본다
  include_any:
    - 소상공인
    - 자영업
    - 창업
    - 점포
    - 상점
    - 외식
    - 골목
    - 전통시장
    - 상점가
    - 임차
    - 임대료
    - 경영안정
    - 소공인
  # 소상공인 점포 창업에 직결되는 핵심어. 걸리면 목록 맨 위로 올린다.
  # ('창업'만 걸린 딥테크·방산 공고보다 '소상공인 정책자금'이 먼저 보여야 한다)
  core_any:
    - 소상공인
    - 자영업
    - 소공인
    - 점포
    - 상점가
    - 전통시장
    - 골목
    - 경영안정
    - 임차
  # 걸리면 제외한다 (제조·수출·딥테크 중심 사업)
  exclude_any:
    - 수출바우처
    - 해외전시
    - 통합한국관
    - 연구개발
    - R&D
    - 특허
    - 스마트공장
    - 방산
    - 딥테크
    - 창업중심대학
    - 실험실창업
    - 바이오헬스
    - 시장개척단
    - 박람회
    - 홈쇼핑
    - 무역사절단
    - 수출상담
    - 비즈니스 매칭
  # 지원분야(pldirSportRealmLclasCodeNm) 우선순위. 낮을수록 먼저 보여준다.
  field_priority:
    창업: 1
    금융: 2
    경영: 3
    내수: 4
    인력: 5
    기타: 6
    기술: 7
    수출: 8

# ── 3단계: 조건별 분기 ★핵심 ──────────────────────────────────
# 각 분기의 키워드가 하나라도 걸리면 그 분기로 분류한다.
# 어느 분기에도 안 걸리면 '조건 없이 신청 가능'이다.
branches:
  unconditional:
    label: 조건 없이 신청 가능
    keywords: []          # 나머지가 전부 여기로

  age_youth:
    label: 청년(연령 제한)이라면
    # 연령 기준이 39/34/29세로 공고마다 다르므로 숫자를 고정하지 않는다.
    # regex 로 "만 NN세 이하/이내" 를 통째로 잡는다.
    regex: ['만\s?\d{2}\s?세\s?(이하|이내|미만)', '만\s?\d{2}\s?[~-]\s?\d{2}\s?세']
    keywords: [청년창업, 청년전용, 청년기업, 청년 창업, 청년 사업자]
    # ⚠️ '청년' 단독은 넣지 않는다. '청년몰'·'청년희망○○' 같은 사업명 고유명사에
    #    오탐이 난다. 지원자격 문맥에서만 잡아야 한다.

  first_time_founder:
    label: 최초 창업이거나 재도전이라면
    keywords:
      - 예비창업
      - 예비창업패키지
      - 생애최초
      - 최초 창업
      - 최초창업
      - 초기창업
      - 사업자등록 전
      - 사업 개시 전
      - 창업 3년
      - 창업3년
      - 업력 3년
      - 3년 미만
      - 신규창업
      - 재도전
      - 재창업
      - 예비재창업
      - 재기지원
      - 폐업 경험
    # ⚠️ '재창업'은 최초 창업의 반대 개념이지만, 사용자가 둘 중 어디에 해당하는지
    #    묻지 않기 위해 같은 분기에 둔다. 리포트에서 공고명으로 구분된다.

  female:
    label: 여성이라면
    keywords:
      - 여성기업
      - 여성창업
      - 여성 창업
      - 여성가장
      - 여성 소상공인
      - 여성 대표자
      - 여성 1인 창업
      - 경력단절여성
      - 경단녀

  designated_zone:
    label: 전통시장·골목형상점가라면
    keywords: [전통시장, 골목형상점가, 상점가, 시장 활성화, 상권 활성화, 골목상권]
    # 이 분기는 상권 데이터의 TRDAR_SE_CD_NM 과 연결된다.
    # 해당 상권이 전통시장/골목형상점가로 지정돼 있으면 자동으로 활성화된다.

  disabled_or_veteran:
    label: 장애인·보훈대상자라면
    keywords: [장애인기업, 장애인 창업, 국가유공자, 보훈]

  other_target:
    label: 그 밖의 특화 대상이라면
    keywords: [사회적기업, 특성화고, 기초생활수급, 저소득]

# ── 4단계: 마감 임박 표시 ─────────────────────────────────────
deadline:
  field: reqstBeginEndDe        # "2026-07-27 ~ 2026-08-25" 형식
  urgent_days: 14               # D-14 이내면 '마감 임박' 표시
  always_open_label: 상시

# ── 자치구 매칭 ────────────────────────────────────────────────
# 소관기관이 '서울특별시'인 공고 중 특정 자치구 전용인 것을 골라낸다.
district_match:
  fields: [pblancNm, hashtags, bsnsSumryCn]
  # 자치구명은 상권 데이터(SIGNGU_CD_NM)에서 가져오므로 여기 하드코딩하지 않는다.
