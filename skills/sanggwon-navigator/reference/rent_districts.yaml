# 임대료 상권 매핑 — 서울시 상권(1,650개) → 한국부동산원 상권(59개)
#
# 두 기관이 '상권'을 다르게 쪼갠다.
#   서울시(서울신용보증재단) : 골목 단위 1,650개  — 매출·유동인구·점포 데이터
#   한국부동산원             : 주요 상권 59개     — 임대료·공실률 데이터
# 이 파일이 둘을 잇는다. 잇지 못하면 임대료를 붙일 수 없다.
#
# 매칭 순서:
#   1) 서울시 상권명에 부동산원 상권명이 들어 있으면 그것 (뚝섬역 → 뚝섬)
#   2) 아니면 자치구의 대표 상권 (성수역[성동구] → 뚝섬)
#   3) 자치구에 부동산원 상권이 없으면 서울 평균
#
# 실측 확인: 2026-07-29, R-ONE OpenAPI SttsApiTblItm.do (STATBL_ID=T248223134698125)
# 최신 분기 202601, 서울 4개 권역 59개 상권

# ── 자치구 → 부동산원 상권 ────────────────────────────────────
# 첫 번째가 그 자치구의 대표 상권(기본값)이다.
# 대표를 정하는 기준: 해당 자치구에서 상업 밀도가 가장 높은 곳.
districts:
  종로구:   [종로, 광화문, 서촌, 북촌, 혜화동]
  중구:     [명동, 을지로, 시청, 충무로, 남대문, 동대문, 방산시장, 약수역]
  용산구:   [이태원, 용산역, 숙명여대]
  성동구:   [뚝섬, 왕십리]          # 성수동 일대 = 뚝섬
  광진구:   [건대입구, 군자]
  동대문구: [청량리, 경희대, 장안동]
  중랑구:   [상봉역]
  성북구:   [성신여대]
  강북구:   [수유, 미아사거리]
  노원구:   [상계역]
  은평구:   [연신내, 불광역]
  서대문구: [신촌/이대]
  마포구:   [홍대/합정, 동교/연남, 공덕역, 망원역]
  양천구:   [목동]
  강서구:   [화곡, 까치산역]
  구로구:   [오류동역]
  금천구:   [독산/시흥]
  영등포구: [영등포역, 당산역]
  동작구:   [노량진, 사당]
  관악구:   [신림역, 서울대입구역]
  서초구:   [교대역, 남부터미널]
  강남구:   [강남대로, 테헤란로, 압구정, 청담, 신사역, 논현역, 도산대로]
  송파구:   [잠실/송파, 가락시장, 잠실새내역]
  강동구:   [천호]
  # ⚠️ 도봉구는 부동산원 상권이 없다 → 서울 평균으로 대체한다.

# ── 이름 매칭 보정 ────────────────────────────────────────────
# 부동산원 상권명이 서울시 상권명과 글자가 달라 자동 매칭이 안 되는 경우.
name_aliases:
  홍대/합정: [홍대, 합정]
  동교/연남: [동교, 연남, 연트럴파크]
  신촌/이대: [신촌, 이대, 이화여대]
  잠실/송파: [잠실, 송파]
  독산/시흥: [독산, 시흥]

# ── 업종 → 권리금 조사 업종 ───────────────────────────────────
# 부동산원 상가권리금 조사는 대분류 5종뿐이다. 서울시 업종코드를 여기에 흡수한다.
premium_industry:
  prefix_map:
    CS1: 숙박 및 음식점업        # 외식업 10종
    CS2: 협회 및 단체,수리 및  기타 개인 서비스업   # 서비스업
    CS3: 도매 및 소매            # 소매업
  default: "전체 "               # 매칭 실패 시 (원본 데이터에 뒤 공백이 있다)

# ── 통계표 ID ─────────────────────────────────────────────────
# R-ONE SttsApiTbl.do 로 실측 확인한 값. 소상공인 창업 기준이라 '소규모 상가'를 쓴다.
# (소규모 상가 = 2층 이하 + 연면적 330㎡ 이하)
statbl:
  rent:     T248223134698125    # 임대동향 지역별 임대료(2024년3분기~)_소규모 상가
  vacancy:  T241833134686576    # 임대동향 지역별 공실률(2024년3분기~)_소규모 상가
  premium:  A_2024_00445        # 시도별/업종별 상가권리금(2022년~)
