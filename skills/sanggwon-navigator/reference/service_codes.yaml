# 업종 매핑 — 사용자가 말한 업종을 서울시 업종코드로 옮기는 판단 기준
#
# 서울시 상권 데이터의 업종은 62개뿐이다. 사람들이 말하는 업종은 그보다 훨씬 다양하다.
# 딱 맞는 코드가 없을 때 무엇으로 볼지 정하는 것이 이 파일의 역할이고,
# 그 판단을 코드에 숨기지 않고 여기 적어두는 것이 이 스킬의 핵심이다.
#
# 매핑 순서:
#   1) aliases 에 있으면 그것으로 확정
#   2) 없으면 데이터의 업종명과 부분 일치 검색
#   3) 그래도 없으면 후보를 제시하고 사용자에게 확인 (질문은 여기서 최대 1회)
#
# 실측 확인: 2026-07-29, 서울 열린데이터광장 VwsmTrdarSelngQq (총 62개 업종)
# 애매 업종 판단 기준: 팀 자체 조사 (golmok.seoul.go.kr 업종 분류 + 국세청 표준산업분류 교차 확인)

# ── 외식업 10종 (창업 문의의 대부분) ────────────────────────────
food_codes:
  CS100001: 한식음식점
  CS100002: 중식음식점
  CS100003: 일식음식점
  CS100004: 양식음식점
  CS100005: 제과점
  CS100006: 패스트푸드점
  CS100007: 치킨전문점
  CS100008: 분식전문점
  CS100009: 호프-간이주점
  CS100010: 커피-음료

# ── 별칭 사전 ──────────────────────────────────────────────────
# 왼쪽은 사람들이 실제로 쓰는 말, 오른쪽은 업종코드.
aliases:
  # 커피-음료
  카페: CS100010
  커피숍: CS100010
  커피전문점: CS100010
  디저트카페: CS100010
  빙수집: CS100010
  버블티: CS100010
  주스전문점: CS100010

  # 제과점
  베이커리: CS100005
  빵집: CS100005
  케이크집: CS100005

  # 한식
  한식당: CS100001
  백반집: CS100001
  국밥집: CS100001
  고깃집: CS100001
  삼겹살집: CS100001

  # 분식
  분식집: CS100008
  떡볶이집: CS100008
  김밥집: CS100008

  # 치킨
  치킨집: CS100007
  치킨: CS100007

  # 호프-간이주점
  술집: CS100009
  호프집: CS100009
  포차: CS100009
  이자카야: CS100009      # 일식음식점으로 볼 여지 있음 — 아래 ambiguous 참조

  # 패스트푸드
  햄버거집: CS100006
  버거집: CS100006
  샌드위치: CS100006

  # 일식·중식·양식
  초밥집: CS100003
  라멘집: CS100003
  중국집: CS100002
  마라탕: CS100002
  파스타집: CS100004
  스테이크집: CS100004

# ── 애매한 업종 — 판단 기준을 명시한다 ─────────────────────────
# 여기 걸리면 기본값으로 진행하되, 리포트에 "다르게 볼 수 있다"를 반드시 표기한다.
# 되묻지 않는다. 틀려도 결과가 통째로 무효가 되지는 않기 때문이다.
#
# 판단 순서 (팀 조사 결과):
#   ① 취급품목·메뉴 기준  →  ② 매출 비중 기준  →  ③ 가장 근접한 대분류로 흡수
#   어느 경우든 사용자가 말한 원본 표현을 리포트에 함께 남긴다.
ambiguous:
  피자:
    default: CS100004        # 양식음식점
    alternative: CS100006    # 패스트푸드점
    reason: >
      서울시 업종 분류에 '피자'는 없다.
      매장 식사 중심(화덕피자·레스토랑형)이면 양식음식점,
      배달·테이크아웃 중심(프랜차이즈형)이면 패스트푸드점에 가깝다.
      어느 쪽인지 모를 때는 점포 수가 많은 양식음식점을 기본값으로 둔다.
    note: ⚠️ 통계청 분류와의 정확한 대응은 미확인. 리포트에 대안을 함께 표기할 것.

  이자카야:
    default: CS100009        # 호프-간이주점
    alternative: CS100003    # 일식음식점
    reason: >
      주류 매출 비중이 크면 호프-간이주점, 식사 중심이면 일식음식점.
      상권 분석 목적에서는 야간 매출 패턴이 중요하므로 호프-간이주점을 기본값으로 둔다.

  브런치카페:
    default: CS100010        # 커피-음료
    alternative: CS100004    # 양식음식점
    reason: >
      객단가와 체류시간은 양식에 가깝지만, 점포 형태와 시간대 매출 패턴은 커피-음료에 가깝다.
      기본값은 커피-음료.

  무인카페:
    default: CS100010
    alternative: null
    reason: >
      '무인'은 운영 형태이지 업종이 아니다. 취급 품목 기준으로 원래 업종에 매핑한다.
      다만 인건비 가정이 달라지므로 수익 추정 시 주의한다.
      (무인아이스크림 할인점 → 슈퍼마켓, 무인문구점 → 문구 도 같은 원칙)

  마라탕:
    default: CS100002        # 중식음식점
    alternative: null
    reason: >
      국세청 표준산업분류상 중화요리 계열로 편입되는 것이 실무 관행이다.
      서울시 업종 분류에 별도 항목이 없어 가장 근접한 대분류로 흡수한다.

  쌀국수:
    default: CS100002        # 중식음식점
    alternative: CS100001    # 한식음식점
    reason: >
      한/중/일/양 4대 분류에 아시안 음식이 들어갈 자리가 없다.
      임시로 중식에 편입하되 **리포트에 "기타 아시안" 임을 반드시 주석으로 남긴다.**
      베트남·태국식 등도 같은 처리.
    note: ⚠️ 분류상 왜곡이 있는 케이스. 결과 해석 시 주의를 표기할 것.

  애견카페:
    default: CS100010        # 커피-음료
    alternative: null
    reason: >
      카페형 복합업종이 서울시 분류에 없다. 주(主) 매출원 기준으로 1차 분류한다.
      음료 매출 중심이면 커피-음료, 반려동물 서비스가 주목적이면 업종 데이터로
      추정할 수 없으므로 등급 대신 정책 매칭만 제공한다.

# ── 매핑 실패 시 ───────────────────────────────────────────────
on_no_match:
  action: suggest_candidates   # 부분 일치 후보 최대 5개를 제시하고 확인받는다
  max_questions: 1             # 질문은 입력 정규화 단계에서 딱 한 번
  fallback: null               # 답이 없으면 업종 없이 '업종 탐색 모드'로 전환

# ── 원가 구조 매핑 (KREI 외식업 경영실태조사) ──────────────────
# 영업이익 = 매출 × (100% - 임대료제외_원가율 - 실제 임대료율)
# 근거와 교차검증은 reference/cost_structure.md 참조.
# ⚠️ 외식업 10종만 있다. 서비스업·소매업은 조사 대상이 아니므로 영업이익을 내지 않는다.
krei_map:
  CS100001: 한식 일반 음식점업
  CS100002: 중식 음식점업
  CS100003: 일식 음식점업
  CS100004: 서양식 음식점업
  CS100005: 제과점
  CS100006: 피자·햄버거·샌드위치 및 유사음식점업
  CS100007: 치킨전문점
  CS100008: 김밥 및 기타 간이 음식점업
  CS100009: 기타 주점업
  CS100010: 커피 전문점
